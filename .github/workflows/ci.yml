# Build check for every pull request (including PRs raised by CodeShield AI).
# Make this a required status check on main so a fix that breaks the build cannot be merged.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lambda zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B -q package

      - name: Check zip layout
        run: |
          test -f target/codesheildsample.zip
          unzip -l target/codesheildsample.zip | grep -q 'com/codeshield/sample/Handler.class'
          unzip -l target/codesheildsample.zip | grep -q 'lib/'
          echo "Dependencies packaged:"
          unzip -Z1 target/codesheildsample.zip | grep '^lib/.*\.jar$'
